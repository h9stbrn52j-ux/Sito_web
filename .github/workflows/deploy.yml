# Rigenera le pagine da content/site.json e pubblica docs/ su GitHub Pages
# a ogni modifica. Richiede: Settings → Pages → Source: "GitHub Actions".
name: Pubblica il sito

on:
  push:
    branches: [main, claude/redesign-lorenzo-mangini-site-0skw2y]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
